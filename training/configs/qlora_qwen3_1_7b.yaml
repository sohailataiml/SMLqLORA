# QLoRA fine-tuning configuration.
#
# Deliberately conventional. The hypothesis under test is DATA -> BEHAVIOR, so
# hyperparameters are set to sane defaults and then held fixed across every run
# in the data-efficiency sweep. Do not tune these per-N; varying them would
# confound the only variable the sweep is supposed to isolate.

run_name: socratic-v1-n600

model:
  base_model: Qwen/Qwen3-1.7B
  # Pinned so the run is reproducible against an exact snapshot of the weights.
  # This is the chat/instruct variant; Qwen/Qwen3-1.7B-Base is the raw LM and is
  # deliberately NOT used here.
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  trust_remote_code: false
  max_seq_length: 2048
  attn_implementation: eager   # 'flash_attention_2' when the GPU supports it

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16   # 'float16' on T4 (no bf16 support)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8      # effective batch size 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 0.3
  optim: paged_adamw_8bit
  logging_steps: 5
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  bf16: false        # set true on Ampere+; T4 must use fp16
  fp16: true
  gradient_checkpointing: true
  seed: 42
  report_to: none

data:
  # The FROZEN Dataset V1 selection (600 examples), not the 1055-example accepted
  # pool it was drawn from. `data/accepted/v1.jsonl` is the pre-selection pool and
  # training on it would silently run a different experiment than the one the
  # dataset card, freeze record and hash describe.
  accepted_path: data/versions/v1/selected.jsonl
  dataset_version: v1
  # Refuse to train if the file on disk no longer hashes to the frozen value.
  expected_dataset_hash: 9121c24e47c7253818040aa40356a67d3a359ddcec057bc5bfc533d6a77e2656
  validation_fraction: 0.1
  # null trains on everything in the file; the data-efficiency sweep overrides
  # this per run.
  limit: null

output:
  output_dir: outputs
  # Set to a Hugging Face repo id to push the adapter after training.
  hub_repo_id: null
  push_to_hub: false
